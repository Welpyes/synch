[global]
modules = [
 "logo",
 "os",
 "kernel",
 "uptime"
]

[logo]
color = "blue"
format = "{distro}"

[os]
key = "OS"
icon = ""
key-color = "white"
icon-color = "light green"
format-color = "light green"
format = "{name} {release} {version} {arch}"

[kernel]
key = "Kernel"
icon = ""
key-color = "white"
icon-color = "light blue"
format-color = "light blue"
format = "{name} {version}"

[uptime]
key = "Uptime"
icon = ""
key-color = "white"
icon-color = "light yellow"
format-color = "light yellow"
format = "{time}"
